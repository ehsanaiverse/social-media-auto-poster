[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-media-auto-poster"
version = "0.1.0"
description = "A local, folder-driven social media publishing automation tool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.17,<2",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
